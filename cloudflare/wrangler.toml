name = "chief-of-staff-bot"
main = "telegram-bridge.js"
compatibility_date = "2024-01-01"

# Required Worker secrets (set via: wrangler secret put <NAME>):
#   TELEGRAM_SECRET      — Telegram webhook secret token
#   GITHUB_PAT           — GitHub personal access token (workflow dispatch)
#   GITHUB_REPO          — GitHub repo (e.g. "username/chief-of-staff")
#   SLACK_SIGNING_SECRET — Slack app signing secret (for /slack/task route)

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
