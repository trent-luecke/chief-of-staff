<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>People Registry</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #181818;
      --surface2: #202020;
      --border: #2c2c2c;
      --text: #ddd;
      --muted: #666;
      --accent: #4a9eff;
      --success: #22c55e;
      --danger: #ef4444;
      --lead: #3b82f6;
      --customer: #22c55e;
      --partner: #f59e0b;
      --internal: #6b7280;
      --unknown: #ef4444;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
    }
    .hidden { display: none !important; }

    /* ── Screens (unsupported / access prompt / loading) ── */
    .screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .center-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 40px 48px;
      text-align: center;
      max-width: 400px;
    }
    .center-card h2 { font-size: 18px; margin-bottom: 10px; }
    .center-card p { color: var(--muted); margin-bottom: 24px; font-size: 13px; }

    /* ── Buttons ── */
    button { cursor: pointer; font-size: 12px; border-radius: 4px; border: none; }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      padding: 9px 20px;
      font-size: 13px;
    }
    .btn-primary:hover { background: #3a8eef; }
    .btn { background: var(--surface2); color: var(--text); padding: 5px 12px; border: 1px solid var(--border); }
    .btn:hover:not(:disabled) { background: #2a2a2a; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-confirm { border-color: var(--success); color: var(--success); }
    .btn-confirm:hover:not(:disabled) { background: rgba(34,197,94,.1); }
    .btn-skip { border-color: var(--danger); color: var(--danger); }
    .btn-skip:hover { background: rgba(239,68,68,.1); }
    .btn-save {
      background: var(--accent);
      color: #fff;
      padding: 9px 22px;
      font-size: 13px;
      border-radius: 4px;
    }
    .btn-save:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-save:hover:not(:disabled) { background: #3a8eef; }

    /* ── App layout ── */
    #app { display: flex; flex-direction: column; min-height: 100vh; }
    .tabs {
      display: flex;
      gap: 2px;
      padding: 10px 16px 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab {
      background: none;
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 4px 4px 0 0;
      border: 1px solid transparent;
      border-bottom: none;
      font-size: 13px;
    }
    .tab.active {
      background: var(--bg);
      color: var(--text);
      border-color: var(--border);
    }
    .tab:hover:not(.active) { color: var(--text); }
    main { flex: 1; overflow-y: auto; padding: 20px 16px; }
    .view { max-width: 780px; margin: 0 auto; }

    /* ── Progress bar ── */
    .progress-bar-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .progress-track {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill { height: 100%; background: var(--accent); transition: width 0.2s; }
    .progress-label { color: var(--muted); font-size: 12px; white-space: nowrap; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 10px;
      transition: opacity 0.15s;
    }
    .card.resolved { opacity: 0.55; }
    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .entity {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }
    .resolution-badge {
      font-size: 11px;
      background: rgba(74,158,255,.15);
      color: var(--accent);
      border: 1px solid rgba(74,158,255,.3);
      border-radius: 3px;
      padding: 1px 7px;
    }
    .card-meta {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }
    .source-badge {
      font-size: 11px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 7px;
      color: var(--muted);
    }
    .card-snippets { color: var(--muted); font-size: 12px; margin-bottom: 10px; line-height: 1.4; }
    .snippet { display: block; }
    .snippet + .snippet { margin-top: 4px; }
    .candidate { font-size: 12px; margin-bottom: 10px; color: var(--muted); }
    .candidate strong { color: var(--text); }
    .confidence { opacity: 0.6; }
    .card-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .card-inline { margin-top: 10px; }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }
    .badge-lead { background: rgba(59,130,246,.2); color: var(--lead); }
    .badge-customer { background: rgba(34,197,94,.2); color: var(--customer); }
    .badge-partner { background: rgba(245,158,11,.2); color: var(--partner); }
    .badge-internal { background: rgba(107,114,128,.2); color: var(--internal); }
    .badge-unknown { background: rgba(239,68,68,.2); color: var(--unknown); }

    /* ── Inline typeahead ── */
    .typeahead-wrap { position: relative; }
    .typeahead-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }
    .typeahead-list {
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 4px 4px;
      z-index: 10;
      max-height: 180px;
      overflow-y: auto;
    }
    .typeahead-item {
      padding: 7px 10px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .typeahead-item:hover { background: var(--surface); }

    /* ── Inline new-person form ── */
    .inline-form { display: flex; flex-direction: column; gap: 8px; }
    .inline-form label { font-size: 11px; color: var(--muted); }
    .inline-form input, .inline-form select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      width: 100%;
      outline: none;
    }
    .inline-form input:focus, .inline-form select:focus { border-color: var(--accent); }
    .inline-form select option { background: var(--surface2); }
    .form-row { display: flex; gap: 8px; }
    .form-row > * { flex: 1; }
    .inline-confirm { font-size: 12px; color: var(--danger); display: flex; gap: 8px; align-items: center; }
    .inline-confirm span { flex: 1; }

    /* ── Save bar ── */
    .save-bar {
      position: sticky;
      bottom: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 20px -16px -20px;
    }
    .save-status { font-size: 12px; color: var(--success); }

    /* ── Registry browser ── */
    .search-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
      margin-bottom: 14px;
    }
    .search-input:focus { border-color: var(--accent); }
    .registry-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 6px;
      cursor: pointer;
      background: var(--surface);
    }
    .registry-row:hover { background: var(--surface2); }
    .registry-name { flex: 1; font-size: 13px; }
    .registry-meta { font-size: 11px; color: var(--muted); }
    .registry-detail {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 4px 4px;
      padding: 12px;
      margin-top: -6px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .detail-row { margin-bottom: 5px; }
    .detail-label { color: var(--muted); margin-right: 6px; }
    .alias-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .alias-chip {
      font-family: monospace;
      font-size: 11px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 6px;
      color: var(--muted);
    }

    /* ── Observations view ── */
    .obs-group { margin-bottom: 18px; }
    .obs-group-header {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .obs-entry {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .obs-entry:last-child { border-bottom: none; }
    .obs-date { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
    .obs-type-badge {
      font-size: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 5px;
      color: var(--muted);
      margin-right: 6px;
    }
    .obs-content { color: var(--text); margin-top: 3px; }

    /* ── Empty states ── */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state h3 { font-size: 15px; margin-bottom: 8px; color: var(--text); }
    .muted { color: var(--muted); }
    hr.section-sep { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    /* ── Merge UI ── */
    .merge-heading { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .merge-heading strong { color: var(--text); }
    .merge-field-table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 6px 0 10px; }
    .merge-field-table th { text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 4px 8px; border-bottom: 1px solid var(--border); }
    .merge-field-table td { padding: 5px 8px; vertical-align: middle; }
    .merge-field-table tbody tr:hover td { background: var(--surface2); }
    .merge-field-label { color: var(--muted); font-size: 11px; width: 100px; }
    .merge-alias-row { margin: 6px 0 10px; }
    .merge-actions { display: flex; gap: 8px; }
    .detail-btns { display: flex; gap: 6px; margin-bottom: 10px; }

    /* ── Registry edit form ── */
    .btn-edit { background: transparent; color: var(--muted); padding: 3px 10px; border: 1px solid var(--border); font-size: 11px; border-radius: 3px; margin-bottom: 10px; cursor: pointer; }
    .btn-edit:hover { color: var(--text); border-color: var(--accent); }
    .edit-form { padding-top: 2px; }
    .edit-fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .edit-form .form-group { display: flex; flex-direction: column; gap: 3px; margin-bottom: 0; }
    .edit-form label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .edit-form input, .edit-form select { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 3px; padding: 5px 7px; font-size: 12px; width: 100%; }
    .edit-form input:focus, .edit-form select:focus { outline: none; border-color: var(--accent); }
    .alias-edit-wrap { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; border: 1px solid var(--border); border-radius: 3px; padding: 5px 7px; background: var(--surface2); min-height: 32px; }
    .alias-chip-rm { background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 2px 4px 2px 6px; font-size: 11px; display: inline-flex; align-items: center; gap: 3px; }
    .alias-chip-rm .rm-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0; line-height: 1; font-size: 13px; }
    .alias-chip-rm .rm-btn:hover { color: var(--danger); }
    .alias-add-input { background: none; border: none; color: var(--text); font-size: 12px; padding: 2px 4px; min-width: 80px; flex: 1; }
    .alias-add-input:focus { outline: none; }
    .edit-actions { display: flex; gap: 8px; margin-top: 10px; }
    .edit-pipeline-row { margin-bottom: 8px; }

    /* ── Projects view ── */
    .offline-banner {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 4px;
      color: var(--danger);
      font-size: 12px;
      padding: 10px 14px;
      margin-bottom: 14px;
    }
    .proj-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 6px;
      cursor: pointer;
      background: var(--surface);
    }
    .proj-row:hover { background: var(--surface2); }
    .proj-name { flex: 1; font-size: 13px; }
    .proj-meta { font-size: 11px; color: var(--muted); }
    .badge-active { background: rgba(34,197,94,.2); color: var(--success); }
    .badge-archived { background: rgba(107,114,128,.2); color: var(--internal); }
    .proj-detail {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 4px 4px;
      padding: 14px;
      margin-top: -6px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .proj-detail-section { margin-bottom: 12px; }
    .proj-detail-section:last-child { margin-bottom: 0; }
    .proj-section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .task-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .task-row:last-child { border-bottom: none; }
    .task-title { flex: 1; font-size: 12px; }
    .btn-done {
      background: transparent;
      border: 1px solid var(--success);
      color: var(--success);
      padding: 2px 8px;
      font-size: 11px;
      border-radius: 3px;
    }
    .btn-done:hover { background: rgba(34,197,94,.1); }
    .add-task-form {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .add-task-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }
    .add-task-input:focus { border-color: var(--accent); }
    .btn-add-task {
      background: var(--accent);
      color: #fff;
      padding: 6px 14px;
      font-size: 12px;
      border-radius: 4px;
      border: none;
    }
    .btn-add-task:hover { background: #3a8eef; }
    .btn-add-task:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Work tab ── */
    .work-section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0 6px; margin-bottom: 4px;
    }
    .work-section-label {
      font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .btn-new-proj {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      font-size: 11px; padding: 3px 10px; border-radius: 3px; cursor: pointer;
    }
    .btn-new-proj:hover { color: var(--text); border-color: var(--accent); }
    .new-proj-inline {
      display: flex; gap: 6px; padding: 8px 0; margin-bottom: 4px;
    }
    .proj-group { margin-bottom: 6px; }
    .proj-group-header {
      display: flex; align-items: center; gap: 8px; padding: 9px 12px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; cursor: pointer; user-select: none;
    }
    .proj-group-header:hover { background: var(--surface2); }
    .proj-group-header.expanded { border-radius: 4px 4px 0 0; }
    .proj-group-header.edit-active { border-color: #f59e0b; }
    .proj-group-chevron { font-size: 10px; color: var(--muted); width: 10px; flex-shrink: 0; }
    .proj-group-name { flex: 1; font-size: 13px; }
    .proj-group-count { font-size: 11px; color: var(--muted); }
    .proj-group-edit-btn {
      background: transparent; border: none; color: var(--muted);
      font-size: 13px; cursor: pointer; padding: 0 4px; line-height: 1;
    }
    .proj-group-edit-btn:hover { color: var(--text); }
    .proj-group-edit-btn.active { color: #f59e0b; }
    .proj-group-body {
      border: 1px solid var(--border); border-top: none;
      border-radius: 0 0 4px 4px; background: var(--surface2); padding: 10px 12px;
    }
    .proj-group-body.edit-active { border-color: #f59e0b; }
    .proj-edit-panel { border-bottom: 1px solid rgba(245,158,11,.3); padding-bottom: 12px; margin-bottom: 10px; }
    .proj-edit-section-label {
      font-size: 10px; font-weight: 600; color: #f59e0b;
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px;
    }
    .proj-edit-field { margin-bottom: 8px; }
    .proj-edit-field-label { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
    .proj-edit-input, .proj-edit-select {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 5px 8px; border-radius: 3px; font-size: 12px;
      box-sizing: border-box; outline: none;
    }
    .proj-edit-input:focus { border-color: var(--accent); }
    .proj-edit-actions { display: flex; gap: 6px; margin-top: 10px; }
    .btn-save {
      background: var(--accent); color: #fff; border: none;
      padding: 4px 14px; border-radius: 3px; font-size: 11px; cursor: pointer;
    }
    .btn-cancel {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 4px 10px; border-radius: 3px; font-size: 11px; cursor: pointer;
    }
    .member-chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 8px; }
    .member-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; padding: 2px 8px; font-size: 11px; color: var(--text);
    }
    .member-chip-role {
      font-size: 9px; padding: 1px 4px; border-radius: 3px;
      background: rgba(129,140,248,.15); color: #818cf8;
    }
    .member-chip-remove { color: var(--muted); cursor: pointer; margin-left: 2px; }
    .member-chip-remove:hover { color: var(--danger); }
    .btn-add-member {
      display: inline-flex; align-items: center; background: transparent;
      border: 1px dashed var(--border); border-radius: 12px; padding: 2px 8px;
      font-size: 11px; color: var(--muted); cursor: pointer;
    }
    .btn-add-member:hover { color: var(--text); border-color: var(--accent); }
    .people-picker-dropdown {
      background: var(--surface); border: 1px solid var(--accent);
      border-radius: 4px; overflow: hidden; margin-top: 4px;
    }
    .people-picker-search {
      width: 100%; background: var(--surface2); border: none;
      border-bottom: 1px solid var(--border); color: var(--text);
      padding: 5px 8px; font-size: 11px; box-sizing: border-box; outline: none;
    }
    .people-picker-option { padding: 5px 10px; font-size: 11px; cursor: pointer; color: var(--text); }
    .people-picker-option:hover { background: var(--surface2); }
    .people-picker-option.already-added { color: var(--muted); cursor: default; }
    .role-picker { border: 1px solid var(--accent); border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .role-picker-header { font-size: 10px; color: var(--muted); padding: 6px 10px 3px; }
    .role-option {
      padding: 5px 10px; font-size: 11px; cursor: pointer; color: var(--text);
      display: flex; justify-content: space-between; align-items: center;
    }
    .role-option:hover { background: var(--surface2); }
    .role-option-desc { font-size: 10px; color: var(--muted); }
    .due-chip {
      font-size: 10px; border-radius: 3px; padding: 1px 5px;
      cursor: pointer; white-space: nowrap;
    }
    .due-chip.upcoming { color: #f59e0b; background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.3); }
    .due-chip.overdue  { color: #ef4444; background: rgba(239,68,68,.1);  border: 1px solid rgba(239,68,68,.3); }
    .due-chip-input {
      font-size: 11px; background: var(--surface); border: 1px solid var(--accent);
      color: var(--text); padding: 2px 5px; border-radius: 3px; width: 110px;
    }
    .owner-chip {
      font-size: 10px; color: #818cf8; background: rgba(129,140,248,.1);
      border: 1px solid rgba(129,140,248,.3); border-radius: 3px; padding: 1px 6px;
      cursor: pointer; white-space: nowrap;
    }
    .assign-ghost, .link-proj-ghost {
      font-size: 10px; color: var(--muted); border: 1px dashed var(--border);
      border-radius: 3px; padding: 1px 6px; cursor: pointer; display: none;
    }
    .task-row:hover .assign-ghost,
    .task-row:hover .link-proj-ghost { display: inline; }
    .owner-dropdown {
      position: absolute; background: var(--surface); border: 1px solid var(--accent);
      border-radius: 4px; z-index: 100; min-width: 140px; overflow: hidden;
    }
    .owner-dropdown-option { padding: 5px 10px; font-size: 11px; cursor: pointer; color: var(--text); }
    .owner-dropdown-option:hover { background: var(--surface2); }
    .owner-dropdown-option.clear { color: var(--muted); }
    .add-task-form-row {
      display: flex; gap: 6px; margin-top: 8px; padding-top: 8px;
      border-top: 1px solid var(--border); align-items: center;
    }
    .add-task-assign {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 5px 6px; border-radius: 3px; font-size: 11px;
    }
    .standalone-section { margin-top: 20px; }
    .new-proj-form {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .new-proj-form input { flex: 1; min-width: 160px; }
    .new-proj-status { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>

  <!-- Screen: unsupported browser -->
  <div id="screen-unsupported" class="screen hidden">
    <div class="center-card">
      <h2>Unsupported Browser</h2>
      <p>This tool requires Chrome or Edge (File System Access API).</p>
    </div>
  </div>

  <!-- Screen: folder access prompt -->
  <div id="screen-access" class="screen hidden">
    <div class="center-card">
      <h2>People Registry</h2>
      <p>Select the repo root folder to load registry data.</p>
      <button class="btn-primary" id="btn-access">Select Repo Folder</button>
    </div>
  </div>

  <!-- Screen: loading -->
  <div id="screen-loading" class="screen hidden">
    <div class="center-card">
      <h2>Loading…</h2>
      <p>Reading registry and unresolved data.</p>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="hidden">
    <nav class="tabs">
      <button class="tab active" data-view="pending">Pending <span id="pending-count"></span></button>
      <button class="tab" data-view="registry">People</button>
      <button class="tab" data-view="observations">Observations</button>
      <button class="tab" data-view="work">Work</button>
    </nav>
    <main>
      <div id="view-pending" class="view"></div>
      <div id="view-registry" class="view hidden"></div>
      <div id="view-observations" class="view hidden"></div>
      <div id="view-work" class="view hidden"></div>
    </main>
  </div>

<script type="module">

// ── Escape helpers ──────────────────────────────────────────────────────────
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const el = id => document.getElementById(id);

// ── File System Access ──────────────────────────────────────────────────────
async function getFileHandle(dirHandle, filePath, create = false) {
  const parts = filePath.split('/');
  let cur = dirHandle;
  for (const part of parts.slice(0, -1)) {
    cur = await cur.getDirectoryHandle(part, { create: false });
  }
  return cur.getFileHandle(parts.at(-1), { create });
}

async function readJSON(dirHandle, path) {
  const fh = await getFileHandle(dirHandle, path, false);
  const file = await fh.getFile();
  return JSON.parse(await file.text());
}

async function writeJSON(dirHandle, path, data) {
  const fh = await getFileHandle(dirHandle, path, true);
  const writable = await fh.createWritable();
  await writable.write(JSON.stringify(data, null, 2));
  await writable.close();
}

async function readLines(dirHandle, path, limit = null) {
  const fh = await getFileHandle(dirHandle, path, false);
  const file = await fh.getFile();
  const text = await file.text();
  const lines = text.split('\n').filter(l => l.trim());
  return limit ? lines.slice(-limit) : lines;
}

// ── State ───────────────────────────────────────────────────────────────────
const state = {
  dir: null,
  registry: null,        // { version, people: [], skiplist?: [] }
  unresolvedState: null, // { telegram_message_id, sent_at, entities: [] }
  unresolvedRich: null,  // { unresolved: [] }
  observations: null,    // string[] | null
  decisions: {},         // keyed by entity string
};

// ── Data loading ────────────────────────────────────────────────────────────
async function loadData() {
  // Required reads — throw if registry is missing
  state.registry = await readJSON(state.dir, 'data/people_registry.json');

  // Primary unresolved list — non-fatal
  state.unresolvedState = await readJSON(state.dir, 'data/people_unresolved_state.json')
    .catch(() => null);

  // Enrichment file — non-fatal
  state.unresolvedRich = await readJSON(state.dir, 'data/people_unresolved.json')
    .catch(() => null);

  // Observations — fully isolated, never blocks the UI
  try {
    state.observations = await readLines(state.dir, 'data/memory/observations.jsonl');
  } catch {
    state.observations = null;
  }

  // Session merging: load any existing decisions from a prior save
  try {
    const existing = await readJSON(state.dir, 'data/people_resolution_decisions.json');
    if (Array.isArray(existing?.decisions)) {
      existing.decisions.forEach(d => { state.decisions[d.entity] = d; });
    }
  } catch { /* no prior decisions */ }
}

function joinUnresolved() {
  if (!state.unresolvedState?.entities?.length) return [];
  // Build lookup from enrichment file, keyed by entity string
  const richMap = {};
  (state.unresolvedRich?.unresolved ?? []).forEach(e => { richMap[e.entity] = e; });
  return state.unresolvedState.entities.map(e => ({
    ...e,
    source: richMap[e.entity]?.source ?? 'unknown',
    added: richMap[e.entity]?.added ?? 'unknown',
    email: richMap[e.entity]?.email ?? null,
  }));
}

function findObservationsForEntity(entity, candidateId) {
  if (!state.observations?.length) return [];
  const matched = [];
  for (const line of state.observations) {
    if (matched.length >= 3) break;
    try {
      const obs = JSON.parse(line);
      if (
        obs.entity === entity ||
        (candidateId && obs.primary_person_id === candidateId) ||
        (candidateId && (obs.related_person_ids ?? []).includes(candidateId))
      ) {
        matched.push(obs);
      }
    } catch { /* skip malformed lines */ }
  }
  return matched;
}

// ── Registry lookup helpers ────────────────────────────────────────────────
function getPersonById(id) {
  return (state.registry?.people ?? []).find(p => p.id === id) ?? null;
}

function getPersonType(id) {
  return getPersonById(id)?.type ?? 'unknown';
}

// ── View: Pending Resolutions ───────────────────────────────────────────────
function renderPendingView() {
  const entries = joinUnresolved();
  const view = el('view-pending');

  if (!entries.length) {
    view.innerHTML = `
      <div class="empty-state">
        <h3>No Pending Resolutions</h3>
        <p>All entities resolved, or no unresolved state file found.</p>
      </div>`;
    el('pending-count').textContent = '';
    return;
  }

  el('pending-count').textContent = `(${entries.length})`;

  const cardsHtml = entries.map(e => makeCard(e)).join('');
  view.innerHTML = `
    <div class="progress-bar-wrap">
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <span class="progress-label" id="progress-label">0 of ${entries.length} resolved</span>
    </div>
    <div id="cards-container">${cardsHtml}</div>
    <div class="save-bar">
      <button class="btn-save" id="btn-save" disabled>Save Decisions</button>
      <span class="save-status hidden" id="save-status">Saved.</span>
    </div>`;

  updateProgress(entries);
  attachCardListeners(entries);

  el('btn-save').addEventListener('click', saveDecisions);
}

function makeCard(entry) {
  const decision = state.decisions[entry.entity];
  const resolved = !!decision;

  // Observation snippet
  const obs = findObservationsForEntity(entry.entity, entry.candidate_id);
  const snippetHtml = obs.length
    ? obs.map(o => `<span class="snippet">${esc(o.content || o.context || '')}</span>`).join('')
    : `<span class="muted">no observations on file</span>`;

  // Candidate match block
  const candidateHtml = entry.candidate_id
    ? `<div class="candidate">
        Possible match: <strong>${esc(entry.candidate_name)}</strong>
        <span class="badge badge-${esc(getPersonType(entry.candidate_id))}">${esc(getPersonType(entry.candidate_id))}</span>
        <span class="confidence">${Math.round((entry.confidence ?? 0) * 100)}%</span>
      </div>`
    : `<div class="candidate muted">No match found</div>`;

  const resolutionBadge = resolved
    ? `<span class="resolution-badge">${esc(decision.action)}</span>` : '';

  return `<div class="card${resolved ? ' resolved' : ''}" data-entity="${esc(entry.entity)}">
    <div class="card-header">
      <span class="entity">${esc(entry.entity)}</span>
      ${resolutionBadge}
    </div>
    <div class="card-meta">
      <span class="source-badge">${esc(entry.source)}</span>
      <span class="muted">${esc(entry.added)}</span>
      ${entry.email ? `<span class="muted">${esc(entry.email)}</span>` : ''}
    </div>
    <div class="card-snippets">${snippetHtml}</div>
    ${candidateHtml}
    <div class="card-actions"${resolved ? ' style="display:none"' : ''}>
      <button class="btn btn-confirm" data-action="confirm" data-entity="${esc(entry.entity)}"
        ${!entry.candidate_id ? 'disabled' : ''}>Confirm</button>
      <button class="btn" data-action="assign" data-entity="${esc(entry.entity)}">Assign to…</button>
      <button class="btn" data-action="new" data-entity="${esc(entry.entity)}">New Person</button>
      <button class="btn btn-skip" data-action="skip" data-entity="${esc(entry.entity)}">Skip</button>
    </div>
    <div class="card-inline" data-entity="${esc(entry.entity)}"></div>
  </div>`;
}

function updateProgress(entries) {
  const total = entries.length;
  const done = Object.keys(state.decisions).filter(k =>
    entries.some(e => e.entity === k)
  ).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const fill = document.getElementById('progress-fill');
  const label = document.getElementById('progress-label');
  const saveBtn = el('btn-save');
  if (fill) fill.style.width = pct + '%';
  if (label) label.textContent = `${done} of ${total} resolved`;
  if (saveBtn) saveBtn.disabled = done === 0;
}

function attachCardListeners(entries) {
  el('cards-container').addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const entity = btn.dataset.entity;
    const entry = entries.find(en => en.entity === entity);
    if (!entry) return;
    const action = btn.dataset.action;
    if (action === 'confirm') handleConfirm(entry, entries);
    if (action === 'assign') handleAssign(entry, entries);
    if (action === 'new') handleNew(entry, entries);
    if (action === 'skip') handleSkip(entry, entries);
  });
}

function resolveCard(entity, decision, entries) {
  state.decisions[entity] = decision;
  const card = document.querySelector(`.card[data-entity="${CSS.escape(entity)}"]`);
  if (!card) return;
  card.classList.add('resolved');
  card.querySelector('.card-header').querySelector('.resolution-badge')?.remove();
  card.querySelector('.card-header').insertAdjacentHTML('beforeend',
    `<span class="resolution-badge">${esc(decision.action)}</span>`);
  const actionsDiv = card.querySelector('.card-actions');
  if (actionsDiv) actionsDiv.style.display = 'none';
  const inlineDiv = card.querySelector('.card-inline');
  if (inlineDiv) inlineDiv.innerHTML = '';
  updateProgress(entries);
}

function handleConfirm(entry, entries) {
  resolveCard(entry.entity, {
    index: entry.index,
    entity: entry.entity,
    action: 'confirm',
    target_id: entry.candidate_id,
  }, entries);
}

function handleSkip(entry, entries) {
  const inlineDiv = document.querySelector(`.card-inline[data-entity="${CSS.escape(entry.entity)}"]`);
  if (!inlineDiv) return;
  inlineDiv.innerHTML = `
    <div class="inline-confirm">
      <span>Add to permanent skiplist?</span>
      <button class="btn" data-skip-cancel>Cancel</button>
      <button class="btn btn-skip" data-skip-confirm>Yes, skip</button>
    </div>`;
  inlineDiv.querySelector('[data-skip-cancel]').addEventListener('click', () => {
    inlineDiv.innerHTML = '';
  });
  inlineDiv.querySelector('[data-skip-confirm]').addEventListener('click', () => {
    resolveCard(entry.entity, { index: entry.index, entity: entry.entity, action: 'skip' }, entries);
  });
}

function handleAssign(entry, entries) {
  const inlineDiv = document.querySelector(`.card-inline[data-entity="${CSS.escape(entry.entity)}"]`);
  if (!inlineDiv) return;
  const people = state.registry?.people ?? [];
  inlineDiv.innerHTML = `
    <div class="typeahead-wrap">
      <input class="typeahead-input" placeholder="Search people…" autocomplete="off" />
      <div class="typeahead-list" id="ta-${esc(entry.entity)}"></div>
    </div>`;
  const input = inlineDiv.querySelector('.typeahead-input');
  const list = inlineDiv.querySelector('.typeahead-list');
  input.focus();

  function renderMatches(query) {
    const q = query.toLowerCase();
    const matches = q.length < 1 ? people.slice(0, 8) : people.filter(p =>
      p.canonical_name.toLowerCase().includes(q) ||
      (p.aliases ?? []).some(a => a.toLowerCase().includes(q))
    ).slice(0, 8);
    list.innerHTML = matches.map(p =>
      `<div class="typeahead-item" data-id="${esc(p.id)}">
        <span>${esc(p.canonical_name)}</span>
        <span class="badge badge-${esc(p.type)}">${esc(p.type)}</span>
      </div>`
    ).join('');
    list.querySelectorAll('.typeahead-item').forEach(item => {
      item.addEventListener('click', () => {
        const person = people.find(p => p.id === item.dataset.id);
        if (!person) return;
        resolveCard(entry.entity, {
          index: entry.index, entity: entry.entity,
          action: 'assign', target_id: person.id,
        }, entries);
      });
    });
  }

  renderMatches('');
  input.addEventListener('input', () => renderMatches(input.value));
}

function handleNew(entry, entries) {
  const inlineDiv = document.querySelector(`.card-inline[data-entity="${CSS.escape(entry.entity)}"]`);
  if (!inlineDiv) return;
  inlineDiv.innerHTML = `
    <div class="inline-form">
      <div class="form-row">
        <div>
          <label>Canonical Name *</label>
          <input id="new-name-${esc(entry.index)}" placeholder="Full Name" />
        </div>
        <div>
          <label>Email</label>
          <input id="new-email-${esc(entry.index)}" placeholder="optional" type="email" />
        </div>
      </div>
      <div class="form-row">
        <div>
          <label>Type</label>
          <select id="new-type-${esc(entry.index)}">
            <option value="unknown">unknown</option>
            <option value="lead">lead</option>
            <option value="customer">customer</option>
            <option value="partner">partner</option>
            <option value="internal">internal</option>
          </select>
        </div>
        <div style="display:flex;align-items:flex-end;gap:6px">
          <button class="btn" data-new-cancel>Cancel</button>
          <button class="btn btn-confirm" data-new-submit>Create</button>
        </div>
      </div>
    </div>`;
  inlineDiv.querySelector('[data-new-cancel]').addEventListener('click', () => {
    inlineDiv.innerHTML = '';
  });
  inlineDiv.querySelector('[data-new-submit]').addEventListener('click', () => {
    const name = inlineDiv.querySelector(`#new-name-${entry.index}`).value.trim();
    if (!name) { inlineDiv.querySelector(`#new-name-${entry.index}`).focus(); return; }
    resolveCard(entry.entity, {
      index: entry.index, entity: entry.entity, action: 'new',
      canonical_name: name,
      email: inlineDiv.querySelector(`#new-email-${entry.index}`).value.trim() || null,
      type: inlineDiv.querySelector(`#new-type-${entry.index}`).value,
    }, entries);
  });
}

async function saveDecisions() {
  const btn = el('btn-save');
  const status = el('save-status');
  btn.disabled = true;

  const sourceId = state.unresolvedState?.telegram_message_id ?? null;
  const decisionsArr = Object.values(state.decisions);

  const payload = {
    decided_at: new Date().toISOString().replace(/\.\d{3}Z$/, ''),
    source_message_id: sourceId,
    decisions: decisionsArr,
  };

  try {
    await writeJSON(state.dir, 'data/people_resolution_decisions.json', payload);
    status.classList.remove('hidden');
    setTimeout(() => status.classList.add('hidden'), 3000);
  } catch (e) {
    alert('Failed to save: ' + e.message);
  } finally {
    btn.disabled = decisionsArr.length === 0;
  }
}

// ── Registry detail helpers ─────────────────────────────────────────────────
function getPersonObs(id) {
  return (state.observations ?? []).reduce((acc, line) => {
    if (acc.length >= 5) return acc;
    try {
      const obs = JSON.parse(line);
      if (obs.primary_person_id === id || (obs.related_person_ids ?? []).includes(id)) acc.push(obs);
    } catch { /* skip */ }
    return acc;
  }, []);
}

function buildDetailReadOnlyHtml(person, personObs) {
  const aliasesHtml = (person.aliases ?? []).length
    ? `<div class="alias-list">${(person.aliases ?? []).map(a =>
        `<span class="alias-chip">${esc(a)}</span>`).join('')}</div>`
    : '<span class="muted">none</span>';
  const obsHtml = personObs.length
    ? personObs.map(o => `
        <div class="obs-entry">
          <div class="obs-date">${esc(o.date ?? '')}
            <span class="obs-type-badge">${esc(o.type ?? '')}</span>
          </div>
          <div class="obs-content">${esc((o.content ?? '').slice(0, 200))}</div>
        </div>`).join('')
    : '<span class="muted">no observations on file</span>';
  return `
    <div class="detail-btns">
      <button class="btn-edit" data-edit-person>Edit</button>
      <button class="btn-edit" data-merge-person>Merge with…</button>
    </div>
    <div class="detail-row"><span class="detail-label">ID:</span><span class="alias-chip">${esc(person.id)}</span></div>
    ${person.email ? `<div class="detail-row"><span class="detail-label">Email:</span>${esc(person.email)}</div>` : ''}
    ${person.pipeline_record ? `<div class="detail-row"><span class="detail-label">Pipeline:</span>${esc(person.pipeline_record)}</div>` : ''}
    ${person.people_file ? `<div class="detail-row"><span class="detail-label">File:</span>${esc(person.people_file)}</div>` : ''}
    <div class="detail-row"><span class="detail-label">Aliases:</span>${aliasesHtml}</div>
    <div class="detail-row" style="margin-top:8px"><span class="detail-label">Observations:</span></div>
    ${obsHtml}`;
}

function buildEditFormHtml(person) {
  const typeOpts = ['unknown', 'lead', 'customer', 'partner', 'internal'];
  const typeSelectHtml = typeOpts.map(t =>
    `<option value="${esc(t)}"${(person.type ?? 'unknown') === t ? ' selected' : ''}>${esc(t)}</option>`
  ).join('');
  const aliasChipsHtml = (person.aliases ?? []).map(a =>
    `<span class="alias-chip-rm" data-alias="${esc(a)}">${esc(a)}<button type="button" class="rm-btn" aria-label="remove">×</button></span>`
  ).join('');
  return `
    <div class="edit-form">
      <div class="edit-fields-grid">
        <div class="form-group">
          <label>Canonical Name</label>
          <input id="ef-name" value="${esc(person.canonical_name ?? '')}">
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="ef-type">${typeSelectHtml}</select>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input id="ef-email" type="email" value="${esc(person.email ?? '')}">
        </div>
        <div class="form-group">
          <label>People File</label>
          <input id="ef-people-file" value="${esc(person.people_file ?? '')}">
        </div>
      </div>
      <div class="form-group edit-pipeline-row">
        <label>Pipeline Record</label>
        <input id="ef-pipeline" value="${esc(person.pipeline_record ?? '')}">
      </div>
      <div class="form-group">
        <label>Aliases</label>
        <div class="alias-edit-wrap" id="ef-aliases">
          ${aliasChipsHtml}
          <input class="alias-add-input" id="ef-alias-input" placeholder="Add alias, press Enter…">
        </div>
      </div>
      <div class="edit-actions">
        <button class="btn" id="ef-cancel">Cancel</button>
        <button class="btn btn-save" id="ef-save">Save</button>
      </div>
    </div>`;
}

function openDetailReadOnly(person, detail) {
  detail.innerHTML = buildDetailReadOnlyHtml(person, getPersonObs(person.id));
  detail.classList.remove('hidden');
  detail.querySelector('[data-edit-person]').addEventListener('click', () => {
    openDetailEdit(person, detail);
  });
  detail.querySelector('[data-merge-person]').addEventListener('click', () => {
    openMergeSearch(person, detail);
  });
}

function openMergeSearch(person, detail) {
  const people = state.registry?.people ?? [];
  detail.innerHTML = `
    <button class="btn-edit" data-back>← Back</button>
    <div style="margin-bottom:8px;font-size:12px;color:var(--muted)">Merge <strong style="color:var(--text)">${esc(person.canonical_name)}</strong> with…</div>
    <div class="typeahead-wrap">
      <input class="typeahead-input" id="ms-input" placeholder="Search for duplicate…" autocomplete="off" />
      <div class="typeahead-list" id="ms-list"></div>
    </div>`;

  detail.querySelector('[data-back]').addEventListener('click', () => openDetailReadOnly(person, detail));

  const input = detail.querySelector('#ms-input');
  const list = detail.querySelector('#ms-list');

  function renderMatches(query) {
    const q = query.toLowerCase();
    const matches = (q.length < 1
      ? people.filter(p => p.id !== person.id).slice(0, 8)
      : people.filter(p => p.id !== person.id && (
          p.canonical_name.toLowerCase().includes(q) ||
          (p.aliases ?? []).some(a => a.toLowerCase().includes(q))
        ))
    ).slice(0, 8);
    list.innerHTML = matches.map(p =>
      `<div class="typeahead-item" data-id="${esc(p.id)}">
        <span>${esc(p.canonical_name)}</span>
        <span class="badge badge-${esc(p.type)}">${esc(p.type)}</span>
      </div>`
    ).join('');
    list.querySelectorAll('.typeahead-item').forEach(item => {
      item.addEventListener('click', () => {
        const target = people.find(p => p.id === item.dataset.id);
        if (target) openMergeConflict(person, target, detail);
      });
    });
  }

  renderMatches('');
  input.addEventListener('input', () => renderMatches(input.value));
  input.focus();
}

function openMergeConflict(personA, personB, detail) {
  const FIELDS = [
    { key: 'canonical_name', label: 'Name' },
    { key: 'type',           label: 'Type' },
    { key: 'email',          label: 'Email' },
    { key: 'people_file',    label: 'People File' },
    { key: 'pipeline_record',label: 'Pipeline' },
  ];

  const mergedAliases = [
    ...(personA.aliases ?? []),
    ...(personB.aliases ?? []).filter(a => !(personA.aliases ?? []).includes(a)),
    personB.id,
  ].filter(Boolean);

  const rowsHtml = FIELDS.map(f => {
    const valA = personA[f.key] ?? '';
    const valB = personB[f.key] ?? '';
    const dispA = valA ? esc(String(valA)) : '<span class="muted">(empty)</span>';
    const dispB = valB ? esc(String(valB)) : '<span class="muted">(empty)</span>';
    const selectA = valA || !valB; // prefer A; if A empty and B has value, prefer B
    return `<tr>
      <td class="merge-field-label">${esc(f.label)}</td>
      <td><label style="display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="radio" name="mf-${esc(f.key)}" value="a"${selectA ? ' checked' : ''}> ${dispA}
      </label></td>
      <td><label style="display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="radio" name="mf-${esc(f.key)}" value="b"${!selectA ? ' checked' : ''}> ${dispB}
      </label></td>
    </tr>`;
  }).join('');

  const aliasChipsHtml = mergedAliases.map(a => `<span class="alias-chip">${esc(a)}</span>`).join('');

  detail.innerHTML = `
    <button class="btn-edit" data-back>← Back</button>
    <div class="merge-heading">Merging <strong>${esc(personA.canonical_name)}</strong> ← <strong>${esc(personB.canonical_name)}</strong><br>
      <span style="font-size:11px">Surviving record: <strong style="color:var(--text)">${esc(personA.canonical_name)}</strong> — pick which value wins for each field.</span>
    </div>
    <table class="merge-field-table">
      <thead><tr>
        <th></th>
        <th>${esc(personA.canonical_name)}</th>
        <th>${esc(personB.canonical_name)}</th>
      </tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    <div class="merge-alias-row">
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Merged Aliases (always combined)</div>
      <div class="alias-list">${aliasChipsHtml || '<span class="muted">none</span>'}</div>
    </div>
    <div class="merge-actions">
      <button class="btn" id="mc-cancel">Cancel</button>
      <button class="btn btn-save" id="mc-confirm">Confirm Merge</button>
    </div>`;

  detail.querySelector('[data-back]').addEventListener('click', () => openMergeSearch(personA, detail));
  detail.querySelector('#mc-cancel').addEventListener('click', () => openDetailReadOnly(personA, detail));

  detail.querySelector('#mc-confirm').addEventListener('click', async () => {
    const surviving = { ...personA };
    FIELDS.forEach(f => {
      const choice = detail.querySelector(`input[name="mf-${f.key}"]:checked`)?.value;
      surviving[f.key] = (choice === 'b' ? personB[f.key] : personA[f.key]) ?? null;
    });
    surviving.aliases = mergedAliases;

    state.registry.people = state.registry.people
      .filter(p => p.id !== personB.id)
      .map(p => p.id === personA.id ? surviving : p);

    const btn = detail.querySelector('#mc-confirm');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      await writeJSON(state.dir, 'data/people_registry.json', state.registry);
    } catch (e) {
      alert('Failed to save: ' + e.message);
      btn.disabled = false;
      btn.textContent = 'Confirm Merge';
      return;
    }

    const currentFilter = document.getElementById('registry-search')?.value ?? '';
    renderRegistryView(currentFilter);
    const row = document.querySelector(`.registry-row[data-id="${CSS.escape(surviving.id)}"]`);
    if (row) row.click();
  });
}

function openDetailEdit(person, detail) {
  detail.innerHTML = buildEditFormHtml(person);

  detail.querySelectorAll('.rm-btn').forEach(btn => {
    btn.addEventListener('click', () => btn.closest('.alias-chip-rm').remove());
  });

  const aliasInput = detail.querySelector('#ef-alias-input');
  aliasInput.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const val = aliasInput.value.trim();
    if (!val) return;
    const existing = [...detail.querySelectorAll('[data-alias]')].map(el => el.dataset.alias);
    if (existing.includes(val)) { aliasInput.value = ''; return; }
    const wrap = detail.querySelector('#ef-aliases');
    const chip = document.createElement('span');
    chip.className = 'alias-chip-rm';
    chip.dataset.alias = val;
    chip.innerHTML = `${esc(val)}<button type="button" class="rm-btn" aria-label="remove">×</button>`;
    chip.querySelector('.rm-btn').addEventListener('click', () => chip.remove());
    wrap.insertBefore(chip, aliasInput);
    aliasInput.value = '';
  });

  detail.querySelector('#ef-cancel').addEventListener('click', () => {
    openDetailReadOnly(person, detail);
  });

  detail.querySelector('#ef-save').addEventListener('click', async () => {
    const nameVal = detail.querySelector('#ef-name').value.trim();
    if (!nameVal) { detail.querySelector('#ef-name').focus(); return; }

    const aliases = [...detail.querySelectorAll('[data-alias]')].map(el => el.dataset.alias);
    const updated = {
      ...person,
      canonical_name: nameVal,
      type: detail.querySelector('#ef-type').value,
      email: detail.querySelector('#ef-email').value.trim() || null,
      people_file: detail.querySelector('#ef-people-file').value.trim() || null,
      pipeline_record: detail.querySelector('#ef-pipeline').value.trim() || null,
      aliases,
    };

    const idx = state.registry.people.findIndex(p => p.id === person.id);
    if (idx !== -1) state.registry.people[idx] = updated;

    const saveBtn = detail.querySelector('#ef-save');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    try {
      await writeJSON(state.dir, 'data/people_registry.json', state.registry);
    } catch (e) {
      alert('Failed to save: ' + e.message);
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save';
      return;
    }

    const currentFilter = document.getElementById('registry-search')?.value ?? '';
    renderRegistryView(currentFilter);
    const row = document.querySelector(`.registry-row[data-id="${CSS.escape(updated.id)}"]`);
    if (row) row.click();
  });
}

// ── View: Registry Browser ──────────────────────────────────────────────────
function renderRegistryView(filter = '') {
  const view = el('view-registry');
  const people = state.registry?.people ?? [];
  const q = filter.toLowerCase();
  const filtered = q
    ? people.filter(p =>
        p.canonical_name.toLowerCase().includes(q) ||
        (p.aliases ?? []).some(a => a.toLowerCase().includes(q)) ||
        (p.email ?? '').toLowerCase().includes(q)
      )
    : people;

  view.innerHTML = `
    <input class="search-input" id="registry-search" placeholder="Search names, aliases, email…" value="${esc(filter)}" />
    <div id="registry-list"></div>`;

  const list = el('registry-list');
  list.innerHTML = filtered.length
    ? filtered.map(p => `
        <div class="registry-row" data-id="${esc(p.id)}">
          <span class="registry-name">${esc(p.canonical_name)}</span>
          <span class="badge badge-${esc(p.type)}">${esc(p.type)}</span>
          <span class="registry-meta">${esc(p.last_seen ?? '')}</span>
          <span class="registry-meta muted">${(p.aliases ?? []).length} aliases</span>
        </div>
        <div class="registry-detail hidden" id="detail-${esc(p.id)}"></div>`
      ).join('')
    : '<div class="empty-state"><p>No results</p></div>';

  list.querySelectorAll('.registry-row').forEach(row => {
    row.addEventListener('click', () => {
      const id = row.dataset.id;
      const detail = document.getElementById(`detail-${id}`);
      if (!detail) return;
      if (!detail.classList.contains('hidden')) {
        detail.classList.add('hidden');
        detail.innerHTML = '';
        return;
      }
      const person = state.registry.people.find(p => p.id === id);
      if (!person) return;
      openDetailReadOnly(person, detail);
    });
  });

  el('registry-search').addEventListener('input', e => {
    renderRegistryView(e.target.value);
  });
  el('registry-search').focus();
}

// ── View: Recent Observations ───────────────────────────────────────────────
function renderObservationsView(filter = '') {
  const view = el('view-observations');

  if (!state.observations) {
    view.innerHTML = `<div class="empty-state"><h3>No Observations File</h3><p>data/memory/observations.jsonl not found.</p></div>`;
    return;
  }

  const lines = state.observations.slice(-200);
  const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000)
    .toISOString().slice(0, 10);

  const parsed = [];
  for (const line of lines) {
    try {
      const obs = JSON.parse(line);
      if ((obs.date ?? '') >= sevenDaysAgo) parsed.push(obs);
    } catch { /* skip */ }
  }

  const q = filter.toLowerCase();
  const filtered = q
    ? parsed.filter(o =>
        (o.content ?? '').toLowerCase().includes(q) ||
        (o.type ?? '').toLowerCase().includes(q) ||
        (o.primary_person_id ?? '').toLowerCase().includes(q)
      )
    : parsed;

  // Group by primary_person_id
  const grouped = {};
  const unattributed = [];
  for (const obs of filtered) {
    if (obs.primary_person_id) {
      (grouped[obs.primary_person_id] ??= []).push(obs);
    } else {
      unattributed.push(obs);
    }
  }

  const renderObs = obs => `
    <div class="obs-entry">
      <div class="obs-date">${esc(obs.date ?? '')}
        <span class="obs-type-badge">${esc(obs.type ?? '')}</span>
        ${obs.source ? `<span class="obs-type-badge">${esc(obs.source)}</span>` : ''}
      </div>
      <div class="obs-content">${esc((obs.content ?? '').slice(0, 300))}</div>
    </div>`;

  const groupsHtml = Object.entries(grouped).map(([pid, obsList]) => {
    const person = getPersonById(pid);
    const label = person ? person.canonical_name : pid;
    return `<div class="obs-group">
      <div class="obs-group-header">${esc(label)}</div>
      ${obsList.map(renderObs).join('')}
    </div>`;
  }).join('');

  const unattributedHtml = unattributed.length ? `
    <hr class="section-sep">
    <div class="obs-group">
      <div class="obs-group-header">Unattributed</div>
      ${unattributed.map(renderObs).join('')}
    </div>` : '';

  view.innerHTML = `
    <input class="search-input" id="obs-search" placeholder="Filter by person, type, or content…" value="${esc(filter)}" />
    ${!filtered.length
      ? '<div class="empty-state"><p>No observations in last 7 days matching filter.</p></div>'
      : groupsHtml + unattributedHtml}`;

  el('obs-search').addEventListener('input', e => renderObservationsView(e.target.value));
  el('obs-search').focus();
}

const API = 'http://localhost:8787';

async function fetchJSON(url, opts = {}) {
  const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

const workState = { expanded: new Set(), editing: new Set() };

// ── Helpers ──────────────────────────────────────────────────────────────────
function formatDate(iso) {
  const [, m, d] = iso.split('-');
  return `${'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ')[+m - 1]} ${+d}`;
}

function sortTasks(tasks) {
  const today = new Date().toISOString().slice(0, 10);
  return [...tasks].sort((a, b) => {
    const aOver = !!(a.due_date && a.due_date < today);
    const bOver = !!(b.due_date && b.due_date < today);
    if (aOver !== bOver) return aOver ? -1 : 1;
    if (a.due_date && b.due_date) return a.due_date < b.due_date ? -1 : 1;
    if (a.due_date !== b.due_date) return a.due_date ? -1 : 1;
    return (a.created_at || '') < (b.created_at || '') ? -1 : 1;
  });
}

function ownerName(ownerId, people) {
  if (!ownerId) return null;
  const p = (people || []).find(x => x.id === ownerId);
  return p ? p.name.split(' ')[0] : ownerId;
}

function renderDueDateChip(task) {
  if (!task.due_date) return '';
  const today = new Date().toISOString().slice(0, 10);
  const cls = task.due_date < today ? 'overdue' : 'upcoming';
  const label = cls === 'overdue' ? 'Overdue' : formatDate(task.due_date);
  return `<span class="due-chip ${cls}" data-task-id="${esc(task.id)}" data-due="${esc(task.due_date)}">${esc(label)}</span>`;
}

function renderOwnerChip(task, people) {
  if (task.owner) {
    return `<span class="owner-chip" data-task-id="${esc(task.id)}">→ ${esc(ownerName(task.owner, people))}</span>`;
  }
  return `<span class="assign-ghost" data-task-id="${esc(task.id)}">+ assign</span>`;
}

function renderTaskRow(task, people, withLinkProj = false) {
  const linkChip = withLinkProj
    ? `<span class="link-proj-ghost" data-task-id="${esc(task.id)}">→ Project</span>`
    : '';
  return `
    <div class="task-row" id="task-row-${esc(task.id)}">
      <button class="btn-done" data-task-id="${esc(task.id)}">Done</button>
      <span class="task-title">${esc(task.title)}</span>
      ${renderDueDateChip(task)}
      <span style="position:relative;display:inline-flex;align-items:center">
        ${renderOwnerChip(task, people)}
      </span>
      ${linkChip}
    </div>`;
}

function showOwnerDropdown(anchor, taskId, people, onSelect) {
  document.querySelectorAll('.owner-dropdown').forEach(d => d.remove());
  const dropdown = document.createElement('div');
  dropdown.className = 'owner-dropdown';
  dropdown.innerHTML =
    `<div class="owner-dropdown-option clear" data-owner="">— Clear owner</div>` +
    (people || []).map(p =>
      `<div class="owner-dropdown-option" data-owner="${esc(p.id)}">${esc(p.name.split(' ')[0])}</div>`
    ).join('');
  anchor.parentElement.style.position = 'relative';
  anchor.parentElement.appendChild(dropdown);
  dropdown.addEventListener('click', async e => {
    const opt = e.target.closest('.owner-dropdown-option');
    if (!opt) return;
    dropdown.remove();
    await onSelect(opt.dataset.owner || null);
  });
  setTimeout(() => {
    const close = e => {
      if (!dropdown.contains(e.target) && e.target !== anchor) {
        dropdown.remove();
        document.removeEventListener('click', close);
      }
    };
    document.addEventListener('click', close);
  }, 0);
}

function wireTaskInteractions(container, people, onChanged) {
  container.addEventListener('click', async e => {
    if (e.target.matches('.btn-done')) {
      const taskId = e.target.dataset.taskId;
      e.target.disabled = true; e.target.textContent = '…';
      try {
        await fetchJSON(`${API}/api/tasks/${encodeURIComponent(taskId)}/complete`, { method: 'POST', body: '{}' });
        const row = document.getElementById(`task-row-${taskId}`);
        if (row) row.remove();
        if (!container.querySelector('.task-row')) onChanged();
      } catch (err) {
        alert('Failed: ' + err.message);
        e.target.disabled = false; e.target.textContent = 'Done';
      }
      return;
    }
    if (e.target.matches('.due-chip')) {
      const taskId = e.target.dataset.taskId;
      const cur = e.target.dataset.due;
      const input = document.createElement('input');
      input.type = 'date'; input.value = cur; input.className = 'due-chip-input';
      e.target.replaceWith(input); input.focus();
      const save = async () => {
        if (input.value && input.value !== cur) {
          await fetchJSON(`${API}/api/tasks/${encodeURIComponent(taskId)}`, {
            method: 'PATCH', body: JSON.stringify({ due_date: input.value }),
          }).catch(() => {});
        }
        onChanged();
      };
      input.addEventListener('blur', save);
      input.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); } });
      return;
    }
    if (e.target.matches('.owner-chip') || e.target.matches('.assign-ghost')) {
      const taskId = e.target.dataset.taskId;
      showOwnerDropdown(e.target, taskId, people, async newOwner => {
        await fetchJSON(`${API}/api/tasks/${encodeURIComponent(taskId)}`, {
          method: 'PATCH', body: JSON.stringify({ owner: newOwner }),
        }).catch(() => {});
        onChanged();
      });
    }
  });
}

function wireAddTaskForm(formId, projectId, onAdded) {
  const titleInput = document.getElementById(`${formId}-title`);
  const dueInput   = document.getElementById(`${formId}-due`);
  const ownerSel   = document.getElementById(`${formId}-owner`);
  const btn        = document.getElementById(`${formId}-btn`);
  if (!titleInput || !btn) return;
  const submit = async () => {
    const title = titleInput.value.trim();
    if (!title) { titleInput.focus(); return; }
    btn.disabled = true;
    try {
      await fetchJSON(`${API}/api/tasks`, {
        method: 'POST',
        body: JSON.stringify({
          title,
          source: 'ui',
          project_id: projectId || null,
          due_date: dueInput.value || null,
          owner: ownerSel.value || null,
        }),
      });
      titleInput.value = ''; dueInput.value = ''; ownerSel.value = '';
      await onAdded();
    } catch (err) {
      alert('Failed to add task: ' + err.message);
    } finally {
      btn.disabled = false;
    }
  };
  btn.addEventListener('click', submit);
  titleInput.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
}

function renderMemberChips(members, people) {
  const chips = (members || []).map(m => {
    const personId = m.id || m.person_id || '';
    const role = m.role || 'contact';
    const person = (people || []).find(p => p.id === personId);
    const label = person ? person.name.split(' ')[0] : personId;
    return `
      <span class="member-chip">
        ${esc(label)}
        <span class="member-chip-role">${esc(role)}</span>
        <span class="member-chip-remove" data-person-id="${esc(personId)}" title="Remove">×</span>
      </span>`;
  }).join('');
  return chips + `<button class="btn-add-member">+ Add</button>`;
}

function openEditPanel(project, people, groupEl) {
  const panelEl = groupEl.querySelector('.proj-edit-panel');
  const headerEl = groupEl.querySelector('.proj-group-header');
  const bodyEl = groupEl.querySelector('.proj-group-body');
  const editBtn = groupEl.querySelector('.proj-group-edit-btn');

  // Toggle off if already editing
  if (workState.editing.has(project.id)) {
    workState.editing.delete(project.id);
    panelEl.innerHTML = '';
    panelEl.classList.add('hidden');
    headerEl.classList.remove('edit-active');
    bodyEl.classList.remove('edit-active');
    editBtn.classList.remove('active');
    return;
  }

  workState.editing.add(project.id);
  headerEl.classList.add('edit-active');
  bodyEl.classList.add('edit-active');
  editBtn.classList.add('active');

  // Make sure body is expanded
  if (!workState.expanded.has(project.id)) {
    workState.expanded.add(project.id);
    bodyEl.classList.remove('hidden');
    groupEl.querySelector('.proj-group-chevron').textContent = '▼';
    headerEl.classList.add('expanded');
  }

  let draftMembers = JSON.parse(JSON.stringify(project.members || []));

  const render = () => {
    panelEl.innerHTML = `
      <div class="proj-edit-section-label">Edit Project</div>
      <div class="proj-edit-field">
        <div class="proj-edit-field-label">Name</div>
        <input class="proj-edit-input" id="edit-name-${esc(project.id)}" value="${esc(project.canonical_name)}" />
      </div>
      <div class="proj-edit-field">
        <div class="proj-edit-field-label">Status</div>
        <select class="proj-edit-select" id="edit-status-${esc(project.id)}">
          <option value="active"${(project.status ?? 'active') === 'active' ? ' selected' : ''}>active</option>
          <option value="archived"${project.status === 'archived' ? ' selected' : ''}>archived</option>
        </select>
      </div>
      <div class="proj-edit-field">
        <div class="proj-edit-field-label">Members</div>
        <div class="member-chips">${renderMemberChips(draftMembers, people)}</div>
        <div id="member-picker-${esc(project.id)}"></div>
      </div>
      <div class="proj-edit-actions">
        <button class="btn-save" id="edit-save-${esc(project.id)}">Save</button>
        <button class="btn-cancel" id="edit-cancel-${esc(project.id)}">Cancel</button>
      </div>`;
    panelEl.classList.remove('hidden');

    // Wire member remove — calls render() to avoid stacked listeners
    panelEl.querySelectorAll('.member-chip-remove').forEach(x => {
      x.addEventListener('click', () => {
        draftMembers = draftMembers.filter(m => (m.id || m.person_id) !== x.dataset.personId);
        render();
      });
    });

    // Wire add member
    panelEl.querySelector('.btn-add-member').addEventListener('click', showPersonPicker);

    function showPersonPicker() {
      const pickerEl = document.getElementById(`member-picker-${project.id}`);
      const addedIds = new Set(draftMembers.map(m => m.id || m.person_id));
      pickerEl.innerHTML = `
        <div class="people-picker-dropdown">
          <input class="people-picker-search" id="picker-search-${esc(project.id)}" placeholder="Search…" />
          ${(people || []).map(p => `
            <div class="people-picker-option ${addedIds.has(p.id) ? 'already-added' : ''}"
                 data-person-id="${esc(p.id)}" data-person-name="${esc(p.name)}">
              ${esc(p.name)}${addedIds.has(p.id) ? ' — already added' : ''}
            </div>`).join('')}
        </div>`;

      document.getElementById(`picker-search-${project.id}`).addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        pickerEl.querySelectorAll('.people-picker-option').forEach(opt => {
          opt.style.display = opt.dataset.personName.toLowerCase().includes(q) ? '' : 'none';
        });
      });

      pickerEl.querySelectorAll('.people-picker-option:not(.already-added)').forEach(opt => {
        opt.addEventListener('click', () => {
          pickerEl.innerHTML = '';
          showRolePicker(opt.dataset.personId, opt.dataset.personName);
        });
      });
    }

    function showRolePicker(personId, personName) {
      const pickerEl = document.getElementById(`member-picker-${project.id}`);
      const roles = [
        { value: 'owner',        label: 'owner',        desc: 'accountable, drives it' },
        { value: 'contact',      label: 'contact',      desc: 'point of contact, keep informed' },
        { value: 'collaborator', label: 'collaborator', desc: 'working on it' },
      ];
      pickerEl.innerHTML = `
        <div class="role-picker">
          <div class="role-picker-header">${esc(personName.split(' ')[0])} — select role:</div>
          ${roles.map(r => `
            <div class="role-option" data-role="${r.value}">
              ${esc(r.label)} <span class="role-option-desc">${esc(r.desc)}</span>
            </div>`).join('')}
        </div>`;
      pickerEl.querySelectorAll('.role-option').forEach(opt => {
        opt.addEventListener('click', () => {
          draftMembers.push({ id: personId, role: opt.dataset.role });
          render();  // re-render panel to show new chip, re-wire all listeners fresh
        });
      });
    }

    // Save
    document.getElementById(`edit-save-${project.id}`).addEventListener('click', async () => {
      const name   = document.getElementById(`edit-name-${project.id}`).value.trim();
      const status = document.getElementById(`edit-status-${project.id}`).value;
      if (!name) return;
      try {
        await fetchJSON(`${API}/api/projects/${encodeURIComponent(project.id)}`, {
          method: 'PATCH',
          body: JSON.stringify({ canonical_name: name, status, members: draftMembers }),
        });
        workState.editing.delete(project.id);
        renderWorkView();
      } catch (err) { alert('Save failed: ' + err.message); }
    });

    // Cancel
    document.getElementById(`edit-cancel-${project.id}`).addEventListener('click', () => {
      workState.editing.delete(project.id);
      panelEl.innerHTML = '';
      panelEl.classList.add('hidden');
      headerEl.classList.remove('edit-active');
      bodyEl.classList.remove('edit-active');
      editBtn.classList.remove('active');
    });
  };

  render();
}

// ── renderWorkView ───────────────────────────────────────────────────────────
async function renderWorkView() {
  const view = el('view-work');
  view.innerHTML = '<div class="muted" style="padding:20px">Loading…</div>';

  let projects, allTasks, people;
  try {
    [projects, allTasks, people] = await Promise.all([
      fetchJSON(`${API}/api/projects`),
      fetchJSON(`${API}/api/tasks`),
      fetchJSON(`${API}/api/people`),
    ]);
  } catch {
    view.innerHTML = `
      <div class="offline-banner">Start tools/server.py to see projects and tasks.</div>
      <div class="empty-state"><h3>Server Offline</h3><p>Run: python tools/server.py</p></div>`;
    return;
  }

  const activeProjects = (projects || []).filter(p => p.status !== 'archived');
  const standaloneTasks = sortTasks((allTasks || []).filter(t => !t.project_id));

  // ── Projects section ────────────────────────────────────────────────────
  const projGroupsHtml = activeProjects.length
    ? activeProjects.map(p => {
        const pTasks = sortTasks((allTasks || []).filter(t => t.project_id === p.id));
        const isExpanded = workState.expanded.has(p.id);
        const statusCls = p.status === 'active' ? 'badge-active' : 'badge-archived';
        const taskRowsHtml = pTasks.length
          ? pTasks.map(t => renderTaskRow(t, people)).join('')
          : '<span class="muted" style="font-size:12px">No open tasks.</span>';
        return `
          <div class="proj-group" id="group-${esc(p.id)}">
            <div class="proj-group-header${isExpanded ? ' expanded' : ''}${workState.editing.has(p.id) ? ' edit-active' : ''}" data-proj-id="${esc(p.id)}">
              <span class="proj-group-chevron">${isExpanded ? '▼' : '▶'}</span>
              <span class="proj-group-name">${esc(p.canonical_name)}</span>
              <span class="badge ${statusCls}">${esc(p.status ?? 'active')}</span>
              <span class="proj-group-count">${pTasks.length} task${pTasks.length !== 1 ? 's' : ''}</span>
              <button class="proj-group-edit-btn${workState.editing.has(p.id) ? ' active' : ''}" data-proj-id="${esc(p.id)}" title="Edit project">✎</button>
            </div>
            <div class="proj-group-body${workState.editing.has(p.id) ? ' edit-active' : ''}${isExpanded ? '' : ' hidden'}" id="group-body-${esc(p.id)}">
              <div class="proj-edit-panel hidden" id="edit-panel-${esc(p.id)}"></div>
              <div id="group-tasks-${esc(p.id)}">${taskRowsHtml}</div>
              ${renderAddTaskForm(p.id, people)}
            </div>
          </div>`;
      }).join('')
    : '<div class="muted" style="padding:8px 0">No active projects.</div>';

  // ── Standalone section ──────────────────────────────────────────────────
  const standaloneHtml = standaloneTasks.length
    ? standaloneTasks.map(t => renderTaskRow(t, people, true)).join('')
    : '<div class="muted" style="font-size:12px">No standalone tasks.</div>';

  view.innerHTML = `
    <div class="work-section-header">
      <span class="work-section-label">Projects</span>
      <button class="btn-new-proj" id="new-proj-toggle">+ New Project</button>
    </div>
    <div class="new-proj-inline hidden" id="new-proj-inline">
      <input class="add-task-input" id="new-proj-name" placeholder="Project name…" style="flex:1" />
      <button class="btn-add-task" id="new-proj-submit">Create</button>
      <span class="new-proj-status" id="new-proj-status"></span>
    </div>
    <div id="work-proj-list">${projGroupsHtml}</div>
    <div class="standalone-section">
      <div class="work-section-header">
        <span class="work-section-label">Standalone</span>
      </div>
      <div id="standalone-tasks">${standaloneHtml}</div>
      ${renderAddTaskForm(null, people)}
    </div>`;

  // ── Wire new project form ───────────────────────────────────────────────
  el('new-proj-toggle').addEventListener('click', () => {
    el('new-proj-inline').classList.toggle('hidden');
    el('new-proj-name').focus();
  });
  const submitNewProject = async () => {
    const name = el('new-proj-name').value.trim();
    if (!name) { el('new-proj-name').focus(); return; }
    el('new-proj-submit').disabled = true;
    el('new-proj-status').textContent = 'Creating…';
    try {
      await fetchJSON(`${API}/api/projects`, {
        method: 'POST',
        body: JSON.stringify({ canonical_name: name, members: [] }),
      });
      await renderWorkView();
    } catch (err) {
      el('new-proj-status').textContent = 'Error: ' + err.message;
      el('new-proj-submit').disabled = false;
    }
  };
  el('new-proj-submit').addEventListener('click', submitNewProject);
  el('new-proj-name').addEventListener('keydown', e => { if (e.key === 'Enter') submitNewProject(); });

  // ── Wire project group expand/collapse and edit ─────────────────────────
  view.querySelectorAll('.proj-group-header').forEach(header => {
    header.addEventListener('click', e => {
      // Edit button handled separately
      if (e.target.matches('.proj-group-edit-btn')) return;
      const projId = header.dataset.projId;
      const bodyEl  = document.getElementById(`group-body-${projId}`);
      const chevron = header.querySelector('.proj-group-chevron');
      if (workState.expanded.has(projId)) {
        workState.expanded.delete(projId);
        bodyEl.classList.add('hidden');
        chevron.textContent = '▶';
        header.classList.remove('expanded');
      } else {
        workState.expanded.add(projId);
        bodyEl.classList.remove('hidden');
        chevron.textContent = '▼';
        header.classList.add('expanded');
      }
    });
  });

  view.querySelectorAll('.proj-group-edit-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const projId  = btn.dataset.projId;
      const project = (projects || []).find(p => p.id === projId);
      const groupEl = document.getElementById(`group-${projId}`);
      if (project && groupEl) openEditPanel(project, people, groupEl);
    });
  });

  // ── Wire task interactions — project groups ─────────────────────────────
  activeProjects.forEach(p => {
    const container = document.getElementById(`group-tasks-${p.id}`);
    if (container) {
      wireTaskInteractions(container, people, () => renderWorkView());
      wireAddTaskForm(`atf-${p.id}`, p.id, () => renderWorkView());
    }
  });

  // ── Wire task interactions — standalone ─────────────────────────────────
  const standaloneContainer = el('standalone-tasks');
  if (standaloneContainer) {
    wireTaskInteractions(standaloneContainer, people, () => renderWorkView());

    // Link to project
    standaloneContainer.addEventListener('click', async e => {
      if (!e.target.matches('.link-proj-ghost')) return;
      const taskId = e.target.dataset.taskId;
      const options = activeProjects.map(p =>
        `<option value="${esc(p.id)}">${esc(p.canonical_name)}</option>`
      ).join('');
      if (!options) { alert('No active projects to link to.'); return; }
      const sel = document.createElement('select');
      sel.innerHTML = `<option value="">Pick a project…</option>${options}`;
      sel.className = 'add-task-assign';
      e.target.replaceWith(sel);
      sel.focus();
      sel.addEventListener('change', async () => {
        const projId = sel.value;
        if (!projId) return;
        await fetchJSON(`${API}/api/tasks/${encodeURIComponent(taskId)}`, {
          method: 'PATCH', body: JSON.stringify({ project_id: projId }),
        }).catch(() => {});
        renderWorkView();
      });
    });

    wireAddTaskForm('atf-standalone', null, () => renderWorkView());
  }

  // Re-open edit panels that were active before re-render
  workState.editing.forEach(projId => {
    const project = (projects || []).find(p => p.id === projId);
    const groupEl = document.getElementById(`group-${projId}`);
    if (project && groupEl) openEditPanel(project, people, groupEl);
  });
}

// ── Entry point ─────────────────────────────────────────────────────────────
async function init() {
  if (!('showDirectoryPicker' in window)) {
    el('screen-unsupported').classList.remove('hidden');
    return;
  }

  el('screen-access').classList.remove('hidden');

  el('btn-access').addEventListener('click', async () => {
    try {
      state.dir = await window.showDirectoryPicker({ mode: 'readwrite' });
    } catch (e) {
      if (e.name !== 'AbortError') alert('Could not open folder: ' + e.message);
      return;
    }
    el('screen-access').classList.add('hidden');
    el('screen-loading').classList.remove('hidden');
    try {
      await loadData();
    } catch (e) {
      alert('Failed to load registry data: ' + e.message);
      el('screen-loading').classList.add('hidden');
      el('screen-access').classList.remove('hidden');
      return;
    }
    el('screen-loading').classList.add('hidden');
    el('app').classList.remove('hidden');
    renderPendingView();
  });

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const view = tab.dataset.view;
      switchTab(view);
      if (view === 'registry') renderRegistryView();
      if (view === 'observations') renderObservationsView();
      if (view === 'work') renderWorkView();
    });
  });
}

init();
</script>
</body>
</html>
