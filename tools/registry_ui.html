// ── renderNoteCard ────────────────────────────────────────────────────────────
function renderNoteCard(note, tags, people, tasks) {
  const tagObjects = (note.tags || []).map(tid => tags.find(t => t.id === tid)).filter(Boolean);
  const borderColor = tagObjects.length ? tagObjects[0].color : 'var(--border)';
  const tagHtml = tagObjects.map(t =>
    `<span class="note-tag-chip" style="color:${t.color};border-color:${t.color}">${esc(t.id)}</span>`
  ).join('');
  const twoDaysAgo = new Date(Date.now() - 2 * 86400000).toISOString().slice(0, 10);
  const showBrief = note.brief && note.brief_flagged_date && note.brief_flagged_date >= twoDaysAgo;
  const personName = note.person_id ? (people.find(p => p.id === note.person_id)?.name || null) : null;
  const taskTitle = note.task_id ? (tasks.find(t => t.id === note.task_id)?.title || null) : null;
  const shortTs = note.ts.slice(0, 16).replace('T', ' ');
  return `
    <div class="note-card" data-note-id="${esc(note.id)}" style="border-left-color:${borderColor}">
      <div class="note-card-ts">
        ${esc(shortTs)}
        ${note.pinned ? '<span class="note-pin-icon">📌</span>' : ''}
        ${showBrief ? '<span class="note-brief-badge">brief</span>' : ''}
      </div>
      ${tagHtml ? `<div class="note-tag-list">${tagHtml}</div>` : ''}
      <div class="note-body">${esc(note.body)}</div>
      ${personName ? `<div class="note-link">→ ${esc(personName)}</div>` : ''}
      ${taskTitle ? `<div class="note-link">↗ ${esc(taskTitle.slice(0, 50))}${taskTitle.length > 50 ? '…' : ''}</div>` : ''}
    </div>`;
}

// ── renderNotesView ───────────────────────────────────────────────────────────
async function renderNotesView() {
  const view = el('view-notes');
  view.innerHTML = '<div class="muted" style="padding:20px">Loading…</div>';

  let notes, tags, people, tasks;
  try {
    [notes, tags, people, tasks] = await Promise.all([
      fetchJSON(`${API}/api/notes`),
      fetchJSON(`${API}/api/notes/tags`),
      fetchJSON(`${API}/api/people`),
      fetchJSON(`${API}/api/tasks`),
    ]);
  } catch {
    view.innerHTML = `<div class="offline-banner">Start tools/server.py to see notes.</div>
      <div class="empty-state"><h3>Server Offline</h3><p>Run: python tools/server.py</p></div>`;
    return;
  }
  notesState._tags = tags;
  notesState._people = people;
  notesState._tasks = tasks;

  // Filter
  let filtered = notes.filter(n => {
    if (notesState.search) {
      const q = notesState.search.toLowerCase();
      if (!n.body.toLowerCase().includes(q) && !n.ts.includes(q)) return false;
    }
    if (notesState.activeTags.size > 0) {
      for (const t of notesState.activeTags) {
        if (!(n.tags || []).includes(t)) return false;
      }
    }
    return true;
  });

  // Sort
  filtered.sort((a, b) => {
    const cmp = a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0;
    return notesState.sortAsc ? cmp : -cmp;
  });

  const pinned = filtered.filter(n => n.pinned);
  const unpinned = filtered.filter(n => !n.pinned);

  // Header bar HTML
  const tagFilterChips = tags.map(t => {
    const active = notesState.activeTags.has(t.id);
    return `<button class="notes-filter-chip${active ? ' active' : ''}" data-tag-id="${esc(t.id)}"
      style="${active ? `border-color:${t.color};color:${t.color}` : ''}">${esc(t.id)}</button>`;
  }).join('');

  // Tag mgmt panel
  const tagMgmtHtml = notesState.showTagMgmt ? renderTagMgmtPanel(tags) : '';

  // Pinned section
  const pinnedHtml = pinned.length ? `
    <div class="note-pinned-section">
      <div class="note-pinned-label">Pinned</div>
      <div class="note-pinned-grid">${pinned.map(n => renderNoteCard(n, tags, people, tasks)).join('')}</div>
    </div>` : '';

  // Main grid (with optional date grouping)
  let mainGridHtml;
  if (notesState.groupByDate && unpinned.length) {
    const byDate = {};
    for (const n of unpinned) {
      const d = n.ts.slice(0, 10);
      (byDate[d] = byDate[d] || []).push(n);
    }
    mainGridHtml = Object.entries(byDate).map(([d, grp]) => `
      <div class="notes-date-group">
        <div class="notes-date-label">${esc(d)}</div>
        <div class="note-masonry${notesState.compact ? ' compact' : ''}">${grp.map(n => renderNoteCard(n, tags, people, tasks)).join('')}</div>
      </div>`
    ).join('');
  } else {
    mainGridHtml = `<div class="note-masonry${notesState.compact ? ' compact' : ''}">${unpinned.map(n => renderNoteCard(n, tags, people, tasks)).join('')}</div>`;
  }

  const emptyHtml = (pinned.length === 0 && unpinned.length === 0)
    ? '<div class="empty-state"><h3>No notes yet</h3><p>Click + to capture your first note.</p></div>'
    : '';

  view.innerHTML = `
    <div class="notes-header">
      <input class="notes-search" id="notes-search-input" placeholder="Search notes…" value="${esc(notesState.search)}" />
      <div class="notes-filter-chips">${tagFilterChips}</div>
      <button class="notes-manage-tags-btn${notesState.showTagMgmt ? ' active' : ''}" id="notes-manage-tags-btn">Manage Tags</button>
      <button class="notes-sort-btn${notesState.sortAsc ? ' active' : ''}" id="notes-sort-btn">${notesState.sortAsc ? 'Oldest first' : 'Newest first'}</button>
      <button class="notes-group-btn${notesState.groupByDate ? ' active' : ''}" id="notes-group-btn">Group by date</button>
      <button class="notes-compact-btn${notesState.compact ? ' active' : ''}" id="notes-compact-btn">Compact</button>
    </div>
    ${tagMgmtHtml}
    ${pinnedHtml}
    ${emptyHtml || mainGridHtml}`;

  // Wire header controls
  el('notes-search-input').addEventListener('input', e => {
    notesState.search = e.target.value;
    renderNotesView();
  });
  view.querySelectorAll('.notes-filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const tid = chip.dataset.tagId;
      if (notesState.activeTags.has(tid)) notesState.activeTags.delete(tid);
      else notesState.activeTags.add(tid);
      renderNotesView();
    });
  });
  el('notes-manage-tags-btn').addEventListener('click', () => {
    notesState.showTagMgmt = !notesState.showTagMgmt;
    renderNotesView();
  });
  el('notes-sort-btn').addEventListener('click', () => {
    notesState.sortAsc = !notesState.sortAsc;
    renderNotesView();
  });
  el('notes-group-btn').addEventListener('click', () => {
    notesState.groupByDate = !notesState.groupByDate;
    renderNotesView();
  });
  el('notes-compact-btn').addEventListener('click', () => {
    notesState.compact = !notesState.compact;
    renderNotesView();
  });

  if (notesState.showTagMgmt) wireTagMgmt(view, tags);

  // Wire card clicks → edit modal
  view.querySelectorAll('.note-card').forEach(card => {
    card.addEventListener('click', () => {
      const note = notes.find(n => n.id === card.dataset.noteId);
      if (note && typeof openNoteModal === 'function') openNoteModal(note);
    });
  });
}

// ── Typeahead picker ──────────────────────────────────────────────────────────
function wireTypeahead(inputEl, dropdownEl, hiddenEl, items) {
  // DEBUG: remove after diagnosing typeahead issue
  console.log('[wireTypeahead]', inputEl.id, '— items:', items.length, items.slice(0,2));
  // Use fixed positioning so the dropdown escapes the modal's overflow clipping context
  function showDropdown(html) {
    const rect = inputEl.getBoundingClientRect();
    Object.assign(dropdownEl.style, {
      position: 'fixed',
      top: rect.bottom + 'px',
      left: rect.left + 'px',
      width: rect.width + 'px',
      right: 'auto',
    });
    dropdownEl.innerHTML = html;
    dropdownEl.classList.remove('hidden');
  }
  inputEl.oninput = () => {
    const q = inputEl.value.toLowerCase().trim();
    dropdownEl.classList.add('hidden');
    dropdownEl.innerHTML = '';
    if (!q) { hiddenEl.value = ''; return; }
    const matches = items.filter(i => i.label.toLowerCase().includes(q)).slice(0, 8);
    if (!matches.length) {
      showDropdown('<div class="note-picker-option" style="color:var(--muted);cursor:default;font-style:italic">No matches</div>');
      return;
    }
    showDropdown(matches.map(i =>
      `<div class="note-picker-option" data-id="${esc(i.id)}">${esc(i.label)}</div>`
    ).join(''));
  };
  dropdownEl.onmousedown = e => {
    const opt = e.target.closest('[data-id]');
    if (!opt) return;
    e.preventDefault();
    hiddenEl.value = opt.dataset.id;
    inputEl.value = items.find(i => i.id === opt.dataset.id)?.label || '';
    dropdownEl.classList.add('hidden');
  };
  inputEl.onblur = () => {
    setTimeout(() => dropdownEl.classList.add('hidden'), 200);
    if (!inputEl.value.trim()) hiddenEl.value = '';
  };
}

// ── Modal tag chips re-render ─────────────────────────────────────────────────
function renderModalTagChips(tags, selectedTags) {
  const container = el('note-modal-tag-chips');
  container.innerHTML = tags.map(t => {
    const sel = selectedTags.has(t.id);
    return `<button class="note-tag-chip-toggle${sel ? ' selected' : ''}" data-tag-id="${esc(t.id)}"
      style="${sel ? `border-color:${t.color};color:${t.color}` : ''}">${esc(t.id)}</button>`;
  }).join('');
  container.querySelectorAll('.note-tag-chip-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const tid = btn.dataset.tagId;
      if (selectedTags.has(tid)) selectedTags.delete(tid);
      else selectedTags.add(tid);
      renderModalTagChips(tags, selectedTags);
    });
  });
}

// ── Note modal ────────────────────────────────────────────────────────────────
function closeNoteModal() {
  el('note-modal-overlay').classList.add('hidden');
}

async function openNoteModal(note) {
  const isEdit = !!note;

  // Always ensure people and tasks are loaded — the cache may be empty if
  // the Notes tab was never visited and tags were pre-seeded (so _tags.length > 0
  // bypasses the FAB's pre-load guard).
  console.log('[openNoteModal] cache before fetch check — _people:', notesState._people.length, '_tasks:', notesState._tasks.length);
  if (!notesState._people.length || !notesState._tasks.length) {
    try {
      const [tags, people, tasks] = await Promise.all([
        fetchJSON(`${API}/api/notes/tags`),
        fetchJSON(`${API}/api/people`),
        fetchJSON(`${API}/api/tasks`),
      ]);
      notesState._tags = tags;
      notesState._people = people;
      notesState._tasks = tasks;
      console.log('[openNoteModal] fetched — _people:', notesState._people.length, '_tasks:', notesState._tasks.length);
    } catch (e) {
      console.error('[openNoteModal] FETCH FAILED:', e.message);
    }
  }

  const tags = notesState._tags;
  const people = notesState._people;
  const tasks = notesState._tasks;

  el('note-modal-title').textContent = isEdit ? 'Edit Note' : 'New Note';
  el('note-body-input').value = isEdit ? note.body : '';
  el('note-brief-check').checked = isEdit ? !!note.brief : false;

  const selectedTags = new Set(isEdit ? (note.tags || []) : []);
  renderModalTagChips(tags, selectedTags);

  el('note-person-input').value = isEdit && note.person_id
    ? (people.find(p => p.id === note.person_id)?.name || note.person_id) : '';
  el('note-person-id').value = isEdit ? (note.person_id || '') : '';

  el('note-task-input').value = isEdit && note.task_id
    ? (tasks.find(t => t.id === note.task_id)?.title || note.task_id) : '';
  el('note-task-id').value = isEdit ? (note.task_id || '') : '';

  el('note-delete-btn').classList.toggle('hidden', !isEdit);
  el('note-pin-btn').classList.toggle('hidden', !isEdit);
  if (isEdit) el('note-pin-btn').textContent = note.pinned ? 'Unpin' : 'Pin';

  el('note-new-tag-form').classList.add('hidden');
  el('note-modal-overlay').classList.remove('hidden');
  el('note-body-input').focus();

  // Save
  el('note-save-btn').onclick = async () => {
    const body = el('note-body-input').value.trim();
    if (!body) { el('note-body-input').focus(); return; }
    const payload = {
      body,
      tags: [...selectedTags],
      person_id: el('note-person-id').value || null,
      task_id: el('note-task-id').value || null,
      brief: el('note-brief-check').checked,
    };
    try {
      if (isEdit) {
        const patch = {};
        if (payload.body !== note.body) patch.body = payload.body;
        if (JSON.stringify(payload.tags.sort()) !== JSON.stringify((note.tags || []).slice().sort())) patch.tags = payload.tags;
        if (payload.person_id !== note.person_id) patch.person_id = payload.person_id;
        if (payload.task_id !== note.task_id) patch.task_id = payload.task_id;
        if (payload.brief !== !!note.brief) patch.brief = payload.brief;
        await fetchJSON(`${API}/api/notes/${encodeURIComponent(note.id)}`, {
          method: 'PATCH',
          body: JSON.stringify({ event_type: 'update', ...patch }),
        });
      } else {
        await fetchJSON(`${API}/api/notes`, { method: 'POST', body: JSON.stringify(payload) });
      }
      closeNoteModal();
      renderNotesView();
    } catch (err) {
      alert('Save failed: ' + err.message);
    }
  };

  // Delete
  if (isEdit) {
    el('note-delete-btn').onclick = async () => {
      if (!confirm('Delete this note?')) return;
      try {
        await fetchJSON(`${API}/api/notes/${encodeURIComponent(note.id)}`, { method: 'DELETE' });
        closeNoteModal();
        renderNotesView();
      } catch (err) {
        alert('Delete failed: ' + err.message);
      }
    };

    // Pin / Unpin
    el('note-pin-btn').onclick = async () => {
      try {
        await fetchJSON(`${API}/api/notes/${encodeURIComponent(note.id)}`, {
          method: 'PATCH',
          body: JSON.stringify({ event_type: 'pin', pinned: !note.pinned }),
        });
        closeNoteModal();
        renderNotesView();
      } catch (err) {
        alert('Pin failed: ' + err.message);
      }
    };
  }

  // + New Tag inline form
  el('note-add-tag-btn').onclick = () => {
    el('note-new-tag-form').classList.remove('hidden');
    el('note-new-tag-name').value = '';
    el('note-new-tag-name').focus();
  };
  el('note-new-tag-cancel').onclick = () => el('note-new-tag-form').classList.add('hidden');
  el('note-new-tag-save').onclick = async () => {
    const name = el('note-new-tag-name').value.trim().toUpperCase().replace(/\s+/g, '_');
    const color = el('note-new-tag-color').value;
    if (!name) return;
    try {
      await fetchJSON(`${API}/api/notes/tags`, {
        method: 'POST', body: JSON.stringify({ id: name, color }),
      });
      const freshTags = await fetchJSON(`${API}/api/notes/tags`);
      notesState._tags = freshTags;
      selectedTags.add(name);
      renderModalTagChips(freshTags, selectedTags);
      el('note-new-tag-form').classList.add('hidden');
    } catch (err) {
      alert('Failed to create tag: ' + err.message);
    }
  };
  el('note-new-tag-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') el('note-new-tag-save').click();
    if (e.key === 'Escape') el('note-new-tag-form').classList.add('hidden');
  });

  // Typeahead pickers
  wireTypeahead(
    el('note-person-input'), el('note-person-dropdown'), el('note-person-id'),
    people.map(p => ({ id: p.id, label: p.name }))
  );
  wireTypeahead(
    el('note-task-input'), el('note-task-dropdown'), el('note-task-id'),
    tasks.map(t => ({ id: t.id, label: t.title }))
  );
}

// ── Tag management panel ──────────────────────────────────────────────────────
function renderTagMgmtPanel(tags) {
  if (!tags.length) {
    return `<div class="notes-tag-mgmt-panel" id="notes-tag-mgmt-panel">
      <div class="notes-tag-mgmt-header">Manage Tags</div>
      <span class="muted" style="font-size:12px">No tags yet. Create one via the + modal.</span>
    </div>`;
  }
  const rows = tags.map(t => `
    <div class="notes-tag-mgmt-row" data-tag-id="${esc(t.id)}">
      <div class="notes-tag-color-dot" style="background:${t.color}"></div>
      <span class="notes-tag-name" data-tag-name>${esc(t.id)}</span>
      <input type="color" class="notes-tag-color-input" value="${t.color}" data-tag-color />
      <button class="notes-tag-action-btn" data-action="rename">Rename</button>
      <button class="notes-tag-action-btn notes-tag-delete-btn" data-action="delete">Delete</button>
    </div>`
  ).join('');
  return `<div class="notes-tag-mgmt-panel" id="notes-tag-mgmt-panel">
    <div class="notes-tag-mgmt-header">Manage Tags</div>
    ${rows}
  </div>`;
}

function wireTagMgmt(view, tags) {
  const panel = view.querySelector('#notes-tag-mgmt-panel');
  if (!panel) return;

  // Color changes
  panel.querySelectorAll('[data-tag-color]').forEach(input => {
    const row = input.closest('.notes-tag-mgmt-row');
    const tagId = row.dataset.tagId;
    input.addEventListener('change', async () => {
      try {
        await fetchJSON(`${API}/api/notes/tags/${encodeURIComponent(tagId)}`, {
          method: 'PATCH', body: JSON.stringify({ color: input.value }),
        });
        renderNotesView();
      } catch (err) {
        alert('Color update failed: ' + err.message);
      }
    });
  });

  // Rename and delete
  panel.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('.notes-tag-mgmt-row');
      const tagId = row.dataset.tagId;

      if (btn.dataset.action === 'delete') {
        if (!confirm(`Delete tag "${tagId}"? Notes that use it will retain the label but lose color.`)) return;
        try {
          await fetchJSON(`${API}/api/notes/tags/${encodeURIComponent(tagId)}`, { method: 'DELETE' });
          renderNotesView();
        } catch (err) {
          alert('Delete failed: ' + err.message);
        }
        return;
      }

      // Rename: swap span → input
      const nameEl = row.querySelector('[data-tag-name]');
      const colorInput = row.querySelector('[data-tag-color]');
      const currentName = nameEl.textContent;
      const input = document.createElement('input');
      input.className = 'notes-tag-rename-input';
      input.value = currentName;
      nameEl.replaceWith(input);
      input.focus();
      input.select();

      let committed = false;
      const doRename = async () => {
        if (committed) return;
        committed = true;
        const newName = input.value.trim().toUpperCase().replace(/\s+/g, '_');
        if (!newName || newName === tagId) { renderNotesView(); return; }
        try {
          await fetchJSON(`${API}/api/notes/tags/${encodeURIComponent(tagId)}`, {
            method: 'PATCH', body: JSON.stringify({ id: newName, color: colorInput.value }),
          });
          renderNotesView();
        } catch (err) {
          alert('Rename failed: ' + err.message);
          renderNotesView();
        }
      };
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') doRename();
        if (e.key === 'Escape') { committed = true; renderNotesView(); }
      });
      input.addEventListener('blur', () => setTimeout(doRename, 200));
    });
  });
}
</script>

  <!-- Floating note capture button (visible on all tabs) -->
  <button id="note-fab" class="note-fab" title="New note">+</button>

  <!-- Note capture/edit modal -->
  <div id="note-modal-overlay" class="note-modal-overlay hidden">
    <div class="note-modal">
      <div class="note-modal-header">
        <span id="note-modal-title">New Note</span>
        <button class="note-modal-close" id="note-modal-close">×</button>
      </div>
      <div class="note-modal-body">
        <div class="note-field-label">Note</div>
        <textarea id="note-body-input" class="note-body-input" placeholder="Write a note…" rows="4"></textarea>

        <div class="note-field-label">Tags</div>
        <div id="note-modal-tag-chips" class="note-modal-tag-chips"></div>
        <div id="note-new-tag-form" class="note-new-tag-form hidden">
          <input id="note-new-tag-name" class="note-field-input" placeholder="TAG_NAME" maxlength="20" style="width:120px" />
          <input id="note-new-tag-color" type="color" value="#555555" style="width:32px;height:28px;border:none;cursor:pointer;background:none" />
          <button class="btn-save" id="note-new-tag-save" style="font-size:11px;padding:3px 10px">Add</button>
          <button class="btn-cancel" id="note-new-tag-cancel">Cancel</button>
        </div>
        <button id="note-add-tag-btn" class="note-ghost-btn">+ New Tag</button>

        <div class="note-field-label" style="margin-top:10px">Person (optional)</div>
        <div class="note-picker-wrap">
          <input id="note-person-input" class="note-field-input" placeholder="Search people…" autocomplete="off" />
          <div id="note-person-dropdown" class="note-picker-dropdown hidden"></div>
        </div>
        <input type="hidden" id="note-person-id" />

        <div class="note-field-label" style="margin-top:10px">Task (optional)</div>
        <div class="note-picker-wrap">
          <input id="note-task-input" class="note-field-input" placeholder="Search tasks…" autocomplete="off" />
          <div id="note-task-dropdown" class="note-picker-dropdown hidden"></div>
        </div>
        <input type="hidden" id="note-task-id" />

        <label class="note-brief-label" style="margin-top:10px;display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="note-brief-check" />
          Include in brief
        </label>
      </div>
      <div class="note-modal-footer">
        <div class="note-modal-footer-left">
          <button id="note-delete-btn" class="btn-danger hidden">Delete</button>
          <button id="note-pin-btn" class="btn-pin hidden">Pin</button>
        </div>
        <div class="note-modal-footer-right">
          <button id="note-cancel-btn" class="btn-cancel">Cancel</button>
          <button id="note-save-btn" class="btn-save">Save</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
