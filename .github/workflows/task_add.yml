name: Add Task from Slack

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Task title"
        required: true
      response_url:
        description: "Slack response_url for posting confirmation"
        required: false
        default: ""
      due_date_raw:
        description: "Raw due date string (e.g. 'friday', 'next tuesday')"
        required: false
        default: ""
      horizon_raw:
        description: "Raw horizon date string — task hidden from active views until this date"
        required: false
        default: ""
      owner_raw:
        description: "Raw owner name to fuzzy-match against people registry (defaults to Trent)"
        required: false
        default: ""
      channel_id:
        description: "Slack channel ID for posting interactive messages"
        required: false
        default: ""
      user_id:
        description: "Slack user ID of the person who ran the command"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  add-task:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Add task
        env:
          TASK_TITLE: ${{ inputs.title }}
          RESPONSE_URL: ${{ inputs.response_url }}
          DUE_DATE_RAW: ${{ inputs.due_date_raw }}
          HORIZON_RAW: ${{ inputs.horizon_raw }}
          OWNER_RAW: ${{ inputs.owner_raw }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          USER_ID: ${{ inputs.user_id }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python scripts/slack_add_task.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tasks.jsonl
          git diff --staged --quiet || git commit -m "chore: add task from slack [skip ci]"
          git push origin main || true
