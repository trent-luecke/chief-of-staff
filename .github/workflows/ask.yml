name: Ask

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Natural language query"
        required: true
        type: string
      chat_id:
        description: "Telegram chat ID"
        required: true
        type: string

jobs:
  answer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: America/Chicago

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Answer query
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          QUERY_TEXT: ${{ inputs.query }}
          QUERY_CHAT_ID: ${{ inputs.chat_id }}
        run: python ask.py

      - name: Persist captures
        run: |
          git config user.name "chief-of-staff[bot]"
          git config user.email "noreply@github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "chore: captures $(date +%Y-%m-%d-%H%M)"
          git pull --rebase
          git push
