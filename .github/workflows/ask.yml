name: Ask

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Natural language query"
        required: true
        type: string
      chat_id:
        description: "Telegram chat ID"
        required: true
        type: string
      reply_to_message_id:
        description: "Telegram message_id this is a reply to (optional)"
        required: false
        type: string

jobs:
  answer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: America/Chicago

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Answer query
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          QUERY_TEXT: ${{ inputs.query }}
          QUERY_CHAT_ID: ${{ inputs.chat_id }}
          REPLY_TO_MESSAGE_ID: ${{ inputs.reply_to_message_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python ask.py

      - name: Commit data files
        run: |
          git add data/notion_updates_queue.json data/brief_prefs.md data/pending_change.json data/people/ data/projects.md data/tasks.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: sync bot data [skip ci]"
          git push origin main || true
