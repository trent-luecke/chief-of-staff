name: Daily Brief

on:
  schedule:
    # BACKSTOP ONLY. The punctual trigger is the Cloudflare Worker cron
    # (cloudflare/wrangler.toml [triggers]), which dispatches this workflow at
    # 7am sharp. GitHub's scheduler runs this 1–5h late; it exists so the brief
    # still sends if the Worker/PAT/Cloudflare ever fails. pipeline.py's same-day
    # guard prevents a duplicate when both fire.
    # 7am CDT (UTC-5, Apr-Oct). Change to "0 13 * * *" in November for CST (UTC-6) —
    # keep this in lockstep with the Worker cron in wrangler.toml.
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  run-brief:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run brief
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AVOMA_API_KEY: ${{ secrets.AVOMA_API_KEY }}
        run: python main.py
