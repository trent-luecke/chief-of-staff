name: Fitness Scout Weekly

on:
  schedule:
    # Friday 7am CDT (UTC-5, Apr–Oct). Change to "0 13 * * 5" in November for CST (UTC-6).
    - cron: "0 12 * * 5"
  workflow_dispatch:

jobs:
  run-fitness-scout:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: America/Chicago

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scout/requirements.txt

      - name: Install dependencies
        run: pip install -r scout/requirements.txt

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Run weekly scout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python -m scout.scout --commit

      - name: Push data files
        # origin/main is a live shared datastore (Registry UI + other jobs commit
        # to it during our run), so a bare push races and loses. Rebase our
        # scout/data commit onto fresh origin/main and retry. scout/data is only
        # written by this workflow, so the rebase never conflicts.
        run: |
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "push attempt $attempt failed (origin/main moved); retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::scout/data could not be pushed after 5 attempts"
          exit 1
