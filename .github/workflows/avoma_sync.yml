name: Nightly Avoma Sync

on:
  schedule:
    # 10pm CDT (UTC-5, Apr-Oct). Change to "0 4 * * *" in November for CST (UTC-6).
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  run-avoma-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: America/Chicago

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Run Avoma sync
        env:
          AVOMA_API_KEY: ${{ secrets.AVOMA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          METRICS_BASE_URL: ${{ secrets.METRICS_BASE_URL }}
          METRICS_PASSWORD: ${{ secrets.METRICS_PASSWORD }}
        run: python scripts/avoma_sync.py

      - name: Commit data changes
        run: |
          git add data/pipeline_cache.json 2>/dev/null || true
          git add data/state/avoma_sync_seen.json 2>/dev/null || true
          git add data/notion_updates_queue.jsonl 2>/dev/null || true
          git add data/deal_events.jsonl 2>/dev/null || true
          git add data/deal_crosswalk.json 2>/dev/null || true
          git add data/deal_pipeline_cache.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: avoma sync data [skip ci]"
          git pull --rebase origin main || true
          git push origin main || true
